<form id="productForm">
    <label for="product-name">Product Name:</label>
    <input type="text" id="name" name="product-name" required><br>
    <label for="product-category">Category:</label> 
    <input type="text" id="category" name="product-category" required><br>
    <label for="product-price">Price:</label>
    <input type="number" id="price" name="product-price" required><br>
    <label for="product-stock">Stock:</label>
    <input type="number" id="stock" name="product-stock" required><br>
    <label for="product-img">Image URL:</label>
    <input type="text" id="img" name="product-img"><br>
    <button type="submit" id="submitBtn">Add Product</button>
</form>
<p id="message"></p>
